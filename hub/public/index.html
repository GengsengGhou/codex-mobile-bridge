<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Codex Mobile Bridge</title><link rel="icon" href="/favicon.png" type="image/png" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="/hub.css"><script type="module" src="/hub-boot.js"></script></head>
<body><header><a class="brand" href="/">Codex Mobile Bridge</a><span id="accountName"></span><div class="language-switch" role="group" aria-label="语言" data-i18n-aria-label="语言"><button id="languageZh" type="button" class="secondary" aria-pressed="true">中文</button><button id="languageEn" type="button" class="secondary" aria-pressed="false">English</button></div><button id="logout" hidden data-i18n="退出登录">退出登录</button></header><main>
<p id="feedback" role="status" aria-live="polite"></p>
<section id="auth" hidden><h1 id="authTitle" data-i18n="登录">登录</h1><p id="setupContext" class="setup-context" hidden data-i18n="电脑设备配对">电脑设备配对</p><form id="authForm"><label><span data-i18n="账户名">账户名</span><input id="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[A-Za-z0-9._\-]+"></label><label><span data-i18n="密码">密码</span><input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><label id="inviteLabel" hidden><span data-i18n="邀请码">邀请码</span><input id="invite" autocomplete="off"></label><button id="authSubmit" type="submit" data-i18n="登录">登录</button></form><button id="authMode" class="secondary" data-i18n="使用邀请注册">使用邀请注册</button></section>
<section id="dashboard" hidden><div class="section-heading"><h1 data-i18n="我的设备">我的设备</h1><button id="refreshDevices" class="secondary" data-i18n="刷新">刷新</button></div><div id="deviceList"></div>
<section id="pairing" class="pairing"><h2 id="pairingTitle" data-i18n="添加设备">添加设备</h2><form id="pairForm"><label><span data-i18n="设备名称">设备名称</span><input id="deviceName" maxlength="80" placeholder="例如：办公室电脑" data-i18n-placeholder="例如：办公室电脑"></label><button id="pairSubmit" type="submit" data-i18n="生成配对码">生成配对码</button></form><div id="pairResult" hidden><label><span data-i18n="配对码">配对码</span><input id="pairCode" type="password" readonly autocomplete="off"></label><p id="pairExpiry"></p><div class="actions"><button id="showPair" class="secondary" data-i18n="显示配对码">显示配对码</button><button id="copyPairCode" class="secondary" data-i18n="复制配对码">复制配对码</button><button id="copyPair" class="secondary" data-i18n="复制配对信息">复制配对信息</button></div></div></section>
<section id="admin" hidden><h2 data-i18n="邀请账户">邀请账户</h2><button id="createInvite" data-i18n="生成邀请">生成邀请</button><div id="inviteResult" hidden><label><span data-i18n="邀请链接">邀请链接</span><input id="inviteLink" readonly></label><p id="inviteExpiry"></p><button id="copyInvite" class="secondary" data-i18n="复制邀请链接">复制邀请链接</button></div></section>
</section></main></body></html>
